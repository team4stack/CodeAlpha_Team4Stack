<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team4Stack - Offline</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">📶</div>
        <img src="/Team4stack_Logo.png?v=8" alt="Team4Stack Logo" class="logo">
        <h1>You're Offline</h1>
        <p>It seems you've lost your internet connection. Don't worry! You can still browse the cached pages.</p>
        <p style="font-size: 0.9rem; opacity: 0.8;">The home page and previously visited pages are available offline.</p>
        <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
        <button class="retry-btn" onclick="goHome()" style="margin-top: 1rem;">Go to Home Page</button>
    </div>

    <script>
        function retryConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                alert('Still offline. Please check your internet connection.');
            }
        }

        function goHome() {
            window.location.href = '/';
        }

        // Check if online status changes
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Show online status indicator
        let onlineStatus = navigator.onLine;
        setInterval(() => {
            if (navigator.onLine !== onlineStatus) {
                onlineStatus = navigator.onLine;
                if (onlineStatus) {
                    window.location.reload();
                }
            }
        }, 1000);
    </script>
</body>
</html>
