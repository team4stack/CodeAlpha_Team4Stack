    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;pointer-events:none" aria-hidden="true" focusable="false">
      <defs>
        <filter id="turbulence-displacement" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />

    <div id="root"></div>

    <!-- Service Worker will be automatically registered by VitePWA plugin -->
    <!-- Note: Service worker is needed for offline functionality -->
    <script>
      // Only clear favicon cache, not service worker
      // Force favicon update on load
      const updateFavicon = () => {
        const faviconLinks = document.querySelectorAll('link[rel*="icon"]');
        faviconLinks.forEach(link => {
          const href = link.getAttribute('href');
          if (href && (href.includes('favicon') || href.includes('apple-touch-icon'))) {
            const baseUrl = href.split('?')[0];
            link.setAttribute('href', baseUrl + '?v=19&t=' + Date.now());
          }
        });
      };
      updateFavicon();
      // Update again after a short delay to ensure it sticks
      setTimeout(updateFavicon, 100);
      
      // Force logo image cache busting
      const forceLogoReload = () => {
        const logoImages = document.querySelectorAll('img[src*="Team4stack_Logo"]');
        logoImages.forEach(img => {
          const src = img.getAttribute('src');
          if (src && !src.includes('v=8')) {
            const baseUrl = src.split('?')[0];
            img.setAttribute('src', baseUrl + '?v=8&t=' + Date.now());
          } else if (src) {
            // Even if v=8 exists, add timestamp to force reload
            const baseUrl = src.split('?')[0];
            img.setAttribute('src', baseUrl + '?v=8&t=' + Date.now());
          }
        });
      };
      
      // Run on load and after a delay
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', forceLogoReload);
      } else {
        forceLogoReload();
      }
      setTimeout(forceLogoReload, 500);
      setTimeout(forceLogoReload, 2000);
    </script>
