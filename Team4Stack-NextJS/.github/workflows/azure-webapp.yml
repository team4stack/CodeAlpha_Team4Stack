name: Build and deploy Node.js app to Azure Web App - Team4Stack-Collaborators

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_DIR: backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm install

      - name: Build backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-backend-app
          path: ${{ env.BACKEND_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-backend-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8914A605FAB2402DA087482966B58039 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BEC4588C47AF4F5285B09B6A3165D74C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F41E6A7EE6DE4BB5A055BD690112C189 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: Team4Stack-Collaborators
          slot-name: Production
          package: .